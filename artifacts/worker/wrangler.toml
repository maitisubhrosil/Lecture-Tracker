# wrangler.toml — Cloudflare Worker config for ePGP Schedule reminders API
# After editing: `pnpm --filter @workspace/worker exec wrangler deploy`

name = "epgp-reminders"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Cron trigger — every minute. Cloudflare guarantees execution.
[triggers]
crons = ["*/5 * * * *"]

# KV namespace for subscriptions + reminders + sent-dedupe state
# After running `wrangler kv namespace create EPGP_KV`, paste the id below.
[[kv_namespaces]]
binding = "EPGP_KV"
id = "032728f47f7c4bf99318fc77de550362"

# Public env vars (safe to commit)
[vars]
VAPID_SUBJECT = "mailto:admin@example.com"
APP_TIME_ZONE = "Asia/Kolkata"
# Public administrator-maintained CSV mirror; no interactive login is needed.
SHEET_CSV_URL = "https://raw.githubusercontent.com/maitisubhrosil/Lecture-Tracker/main/attached_assets/Term_VI_Schedule_Final_Live.xlsx_-_Sheet1_1788178867780.csv"
FALLBACK_SCHEDULE_URL = "https://maitisubhrosil.github.io/Lecture-Tracker/schedule-data.json"

# Secrets (set via `wrangler secret put VAPID_PUBLIC_KEY` etc., NEVER commit):
#   VAPID_PUBLIC_KEY
#   VAPID_PRIVATE_KEY

# Observability
[observability]
enabled = true
